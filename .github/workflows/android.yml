# Build APK Android dari folder mobile/.
# - Setiap push ke main (yang mengubah mobile/ atau src/core/): APK bisa diunduh di tab Actions → run → Artifacts.
# - Push tag "v*" (mis. v1.0.0): APK otomatis dilampirkan ke halaman Releases.
name: Android · APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mobile/**'
      - 'src/core/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/core/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # build pertama (tanpa cache) bisa lama; berikutnya lebih cepat berkat cache Gradle
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # src/core memakai tipe dari node_modules root saat typecheck
      - name: Install (root)
        working-directory: .
        run: npm ci

      - name: Install (mobile)
        run: npm ci

      - name: Typecheck & lint
        run: |
          npm run typecheck
          npm run lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        # hanya arsitektur HP sungguhan (bukan emulator) → build lebih cepat & APK lebih kecil
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        id: apk
        run: |
          NAME="kalkulator-hpp-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=mobile/$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kalkulator-hpp-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
